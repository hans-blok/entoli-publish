# ============================================================
# MkDocs Configuration — Entoli 
# ============================================================

# ------------------------------------------------------------
# 1. Site Identity
# ------------------------------------------------------------
site_name: "entoli"
site_description: "Publicatie van de Entoli-modellen"
site_author: "Entoli Team"
site_url: "https://hans-blok.github.io/entoli-publish/"

# Repository referentie — bewust niet ingevuld.
# Material toont het repository-blok (icoon, naam, sterren, forks) in de header
# zodra `repo_url` is gezet. De publieke site houdt de header leeg op
# merk | navigatie | zoeken. Zet `repo_name`, `repo_url` en `edit_uri` terug
# om het blok (en eventuele "edit this page"-links) weer aan te zetten.

# ------------------------------------------------------------
# 2. Documentation Source
# ------------------------------------------------------------
docs_dir: "doc"
site_dir: "site"

# ------------------------------------------------------------
# 3. Theme & Presentation
# Entoli house style with Material theme
# ------------------------------------------------------------
theme:
  name: "material"
  language: "en"
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    # Kleuren komen uit doc/stylesheets/entoli.css (gemeten uit het logo)
    scheme: "default"
  # false = geen Google Fonts. Manrope wordt zelf gehost vanuit
  # doc/stylesheets/fonts.css; voor code valt Material terug op zijn
  # eigen stack (SFMono, Consolas, Menlo, monospace).
  font: false
  favicon: "assets/entoloi-logo.png"

# ------------------------------------------------------------
# 4. Custom Styling - Entoli Stylesheet
# Owner: Presentation Architect
# ------------------------------------------------------------
extra_css:
  - stylesheets/fonts.css
  - stylesheets/entoli.css
  - stylesheets/home.css

extra_javascript: []

# ------------------------------------------------------------
# 5. Plugins
# ------------------------------------------------------------
plugins:
  - search:
      lang: en

# ------------------------------------------------------------
# 5a. Hooks
# ------------------------------------------------------------
hooks:
  - scripts/external_links.py

# ------------------------------------------------------------
# 6. Markdown Extensions
# ------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # permalink: false houdt de heading-id's (en dus de anchors en de TOC) intact,
  # maar genereert geen zichtbaar ¶-teken achter koppen.
  - toc:
      permalink: false
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------
# 7. Navigation Structure
# Primary responsibility: Publication Steward
# ------------------------------------------------------------
nav:
  - Home: index.md
  - Business Model:
      - business-model/business-model.md
      - business-model/business-model-canvas.md
  - Soevereiniteit: soevereiniteit.md
  # Externe bestemming. De hook in scripts/external_links.py vult voor
  # navigatielinks naar buiten de site target/rel aan.
  - In een notendop: "https://claude.ai/code/artifact/aa438e42-f91f-44e6-a867-2bdf6e999881"

# ------------------------------------------------------------
# 8. Extra Configuration
# ------------------------------------------------------------
extra:
  social: []
  generator: false  # Verberg "Made with Material for MkDocs"

# ------------------------------------------------------------
# 9. Copyright
# ------------------------------------------------------------
copyright: "Copyright &copy; 2026 Maxia Consultancy. Alle rechten voorbehouden."

