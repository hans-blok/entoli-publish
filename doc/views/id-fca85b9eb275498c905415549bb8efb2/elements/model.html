										dataElements.push({id:"id-53c6d3a2ddf84087bb2f6e66e5ab0334", type:"DataObject", specialization:decodeURL(""), name:decodeURL("Reasoning+mode"), documentation:decodeURL("Reasning+mode+is+a+classification+axis+that+gates+whether+an+agent%27s+work+is+subject+to+the+content-governance+model+%E2%80%94+the+combination+of+**Source-regime**%2C+**Synthesis-regime**%2C+and+**Task+Mode**+%E2%80%94+based+on+one+question%3A+does+this+step+require+an+LLM+to+reason+at+all.%0D%0A%0D%0ALeading+question+Does+this+agent-intent+require+an+LLM+to+reason+about+meaning%2C+or+does+it+execute+by+fixed+procedure+with+no+reasoning%3F%0D%0A%0D%0A**Provenance**%3A+replaces+the+retired+**Mode+of+operation**+concept+%28see+Appendix+%E2%80%94+Deprecated+terms%29.+Mode+of+operation%27s+three+positions+%28Content%2C+Representation-transforming%2C+Conditional%29+answered+three+loosely+related+questions+under+one+label%3B+Determinism+asks+exactly+one%2C+and+collapses+the+two+non-content+positions+%E2%80%94+both+of+which+were%2C+on+inspection%2C+already+mechanical%2Frule-based+rather+than+meaning-blind-with-exceptions+%E2%80%94+into+a+single+**Deterministic**+position.+See+%60temp%2Fclaude-code-plans%2Fplan-execution-nature.md%60+for+the+full+migration+record.%0D%0A%0D%0A%23%23%23+Characteristics+%E2%AD%90%0D%0A-+One+of+two+**agent-intent**+classification+axes+%28alongside+**Development+phase**%2C+which+is+agent-level+%E2%80%94+see+Development+phase%2C+Explanation%29%0D%0A-+Is+a+**gate**%2C+not+a+scale%3A+each+position+determines+*whether*+Source-regime%2FSynthesis-regime%2FTask+Mode+apply%2C+not+*how+much*+meaning-transformation+is+permitted%0D%0A-+Independent+of+other+axes%2C+including+**Execution+Strategy**%3A+Execution+Strategy+governs+how+a+*sequence*+of+steps+progresses+and+has+no+vocabulary+for+whether+one+step+is+mechanical%3B+Determinism+governs+whether+one+step+requires+reasoning+at+all+and+has+no+vocabulary+for+sequencing.+A+single+Orchestration+Specification+may+freely+compose+Deterministic+and+Cognitive+steps+under+any+Execution+Strategy+%E2%80%94+neither+axis+may+be+inferred+from%2C+or+used+to+infer%2C+the+other+%28see+Execution+Strategy%2C+Relationships%29%0D%0A-+A+**Deterministic**+agent-intent+is+realised+as+a+script%2C+never+as+an+LLM+call%3B+a+**Cognitive**+agent-intent+is+realised+as+an+LLM+call+with+full+content-governance+applying%0D%0A%0D%0A%23%23%23+What+it+is+not+%E2%9D%8C%0D%0A-+Not+a+meaning-transformation+scale+%28that+is+**Synthesis-regime**%29%0D%0A-+Not+a+task-shape+classification+%28that+is+**Task+Mode**%29%0D%0A-+Not+a+progression-logic+constraint+%28that+is+**Execution+Strategy**%29+%E2%80%94+see+Characteristics%0D%0A-+Not+redundant+with+Synthesis-regime+or+Task+Mode%3A+its+positions+gate+whether+those+two+axes+%28and+Source-regime%29+apply%2C+they+do+not+duplicate+a+value+on+either+axis%27s+scale%0D%0A%0D%0A%23%23%23+Synonyms+%F0%9F%8F%B7%EF%B8%8F%0D%0A-+Cognitive+gate%0D%0A%0D%0A%23%23%23+Explanation+%F0%9F%92%AC%0D%0ADeterminism+distinguishes+agent-intents+that+require+an+LLM+to+reason+from+work+that+is+realised+as+a+script+and+never+invokes+an+LLM+at+all+%E2%80%94+mechanical+representation-conversion+and+rule-based+condition%2Fhygiene+checks+alike.+Because+a+Deterministic+step+never+invokes+an+LLM%2C+it+never+has+content+to+govern+and+never+has+a+temperature+to+calibrate+%28see+%60foundations%2F.canonical%2Fdata-model%2Flogical-seed%2Fseed.model.md%60+%C2%A77%2C+collapsed+to+the+Cognitive+dimension+only+as+part+of+this+migration%29.%0D%0A%0D%0A**Binding+level**%3A+bound+to+**agent-intent**%2C+matching+Mode+of+operation%27s+corrected+binding+level+%28not+Agent%29+%E2%80%94+declared+per+intent%2C+alongside+Source-regime%2C+Synthesis-regime%2C+and+Task+Mode+where+those+apply.%0D%0A%0D%0A%23%23%23+Positions+%28Position+Elements%29+%F0%9F%93%8B%0D%0A%0D%0A%7C+Position+%7C+Element+classification+%7C+Description+%7C+Content-governance+model+applies%3F+%7C%0D%0A%7C---%7C---%7C---%7C---%7C%0D%0A%7C+**Cognitive**+%7C+Position 												dataElements.push({id:"id-38e1a3641805465c920243442bf2f120", type:"Principle", specialization:decodeURL(""), name:decodeURL("We+are+sovereign"), documentation:decodeURL("**Short+description**++%0D%0AWe+are+sovereign%3A+we+make+our+own+decisions+and+do+not+make+ourselves+structurally+dependent+on+external+parties%2C+vendors+or+closed+ecosystems.%0D%0A%0D%0A%23%23%23+Rationale%0D%0AThis+principle+safeguards+that+conviction+at+the+organisational+level+and+protects+our+independence+and+autonomy.+By+choosing+sovereignty%2C+we+retain+control+over+our+own+direction%2C+knowledge+and+development.%0D%0A%0D%0AIn+a+world+where+vendor+lock-in+and+dependency+on+large+platforms+keep+growing%2C+this+principle+protects+our+freedom+to+choose+what+is+best+for+our+own+situation.%0D%0A%0D%0A%23%23%23+Implications%0D%0A%0D%0A**For+decision-making**%3A%0D%0A-+We+deliberately+choose+open+standards+and+open-source+tools%0D%0A-+In+vendor+choices%2C+long-term+autonomy+weighs+more+heavily+than+short-term+convenience%0D%0A-+We+build+and+maintain+core+knowledge+ourselves+rather+than+fully+outsourcing+it%0D%0A%0D%0A**For+architecture+and+technology**%3A%0D%0A-+Vendor+lock-in+is+actively+avoided%0D%0A-+We+prefer+solutions+where+we+fully+control+data+and+logic%0D%0A-+We+continue+to+develop+and+innovate+ourselves%2C+even+when+that+requires+more+effort%0D%0A-+We+are+investigating+the+possibility+of+developing+our+own+LLM+to+retain+full+control+over+our+AI+capabilities%0D%0A%0D%0A**For+organisation+and+culture**%3A%0D%0A-+We+invest+in+our+own+knowledge+and+skills%0D%0A-+We+document+and+share+knowledge+internally+so+we+are+not+dependent+on+individual+people+or+external+parties%0D%0A-+We+take+responsibility+for+our+own+course%0D%0A%0D%0A%23%23%23+Examples%0D%0A%0D%0A**Good**+%E2%9C%93%0D%0A-+Using+Linux+as+an+operating+system+instead+of+proprietary+alternatives%0D%0A-+Choosing+open-source+databases+with+a+strong+community+and+standards%0D%0A-+Developing+and+managing+agents+ourselves+within+E 												dataElements.push({id:"id-50597cb2e8e147b7a6e9a7429233aba5", type:"Principle", specialization:decodeURL(""), name:decodeURL("We+prove+first+%28then+scale%29"), documentation:decodeURL("**Short+description**++%0D%0AWe+first+prove+that+something+has+value%2C+before+trying+to+make+it+big.%0D%0A%0D%0A%23%23%23+Rationale%0D%0AIn+an+early+stage%2C+scale+is+often+a+distraction.+The+real+risk+is+not+that+something+fails+to+scale%2C+but+that+it+has+no+meaningful+value.+By+focusing+on+value+first%2C+we+learn+what+really+matters+and+avoid+wasting+energy+on+scalability+problems+that+may+never+become+relevant.%0D%0A%0D%0AThis+principle+guards+our+focus+and+prevents+over-engineering+and+premature+optimisation.+It+forces+us+to+work+with+small%2C+real+signals+rather+than+large+assumptions.%0D%0A%0D%0A%23%23%23+Implications%0D%0A%0D%0A**For+product+development**%3A%0D%0A-+Ideas+are+first+substantively+tested+with+a+small%2C+concrete+audience%0D%0A-+We+build+for+a+concrete+use+case%2C+not+for+%22the+market%22+in+general%0D%0A-+Small%2C+real+signals+%28usage%2C+feedback%29+weigh+more+heavily+than+large+assumptions%0D%0A%0D%0A**For+architecture**%3A%0D%0A-+Scalability+follows+from+value%2C+not+the+other+way+around%0D%0A-+We+build+simple+and+extensible%2C+not+complex+and+%22future-proof%22%0D%0A-+We+refactor+towards+scale+when+it+proves+necessary%2C+not+in+advance%0D%0A%0D%0A**For+decision-making**%3A%0D%0A-+Decisions+are+made+based+on+learning+and+feedback%2C+not+on+ambition+or+assumptions%0D%0A-+We+invest+in+experiments+and+prototypes+before+making+large+commitments%0D%0A-+We+accept+that+not+every+idea+scales%2C+and+that+is+okay%0D%0A%0D%0A%23%23%23+Examples%0D%0A%0D%0A**Good**+%E2%9C%93%0D%0A-+Testing+a+new+agent+first+with+one+concrete+use+case+and+improving+iteratively%0D%0A-+Manually+walking+through+a+workflow+before+building+automation%0D%0A-+Publishing+a+knowledge+article+and+gathering+feedback+before+producing+a+whole+series%0D%0A-+A+simple+file-based+implementation 											dataViews.push({id:"id-1804920721c441e99fa0b0cee4c77f6a", type:"ArchimateDiagramModel", name:decodeURL("agent-classification"), documentation:decodeURL("Reasinon+mode++is+a+classification+axis+that+gates+whether+an+**agent-intent**%27s+work+is+subject+to+the+content-governance+model+%E2%80%94+the+combination+of+**Source-regime**%2C+**Synthesis-regime**%2C+and+**Task+Mode**+%E2%80%94+based+on+one+question%3A+does+this+step+require+an+LLM+to+reason+at+all.%0D%0A%0D%0A**Leading+question%3A**+Does+this+agent-intent+require+an+LLM+to+reason+about+meaning%2C+or+does+it+execute+by+fixed+procedure+with+no+reasoning%3F%0D%0A%0D%0A**Provenance**%3A+replaces+the+retired+**Mode+of+operation**+concept+%28see+Appendix+%E2%80%94+Deprecated+terms%29.+Mode+of+operation%27s+three+positions+%28Content%2C+Representation-transforming%2C+Conditional%29+answered+three+loosely+related+questions+under+one+label%3B+Determinism+asks+exactly+one%2C+and+collapses+the+two+non-content+positions+%E2%80%94+both+of+which+were%2C+on+inspection%2C+already+mechanical%2Frule-based+rather+than+meaning-blind-with-exceptions+%E2%80%94+into+a+single+**Deterministic**+position.+See+%60temp%2Fclaude-code-plans%2Fplan-execution-nature.md%60+for+the+full+migration+record.%0D%0A%0D%0A%23%23%23+Characteristics+%E2%AD%90%0D%0A-+One+of+two+**agent-intent**+classification+axes+%28alongside+**Development+phase**%2C+which+is+agent-level+%E2%80%94+see+Development+phase%2C+Explanation%29%0D%0A-+Is+a+**gate**%2C+not+a+scale%3A+each+position+determines+*whether*+Source-regime%2FSynthesis-regime%2FTask+Mode+apply%2C+not+*how+much*+meaning-transformation+is+permitted%0D%0A-+Independent+of+other+axes%2C+including+**Execution+Strategy**%3A+Execution+Strategy+governs+how+a+*sequence*+of+steps+progresses+and+has+no+vocabulary+for+whether+one+step+is+mechanical%3B+Determinism+governs+whether+one+step+requires+reasoning+at+all+and+has+no+vocabulary+for+sequencing.+A+single+Orchestration+Specification+may+freely+compose+Deterministic+and+Cognitive+steps+under+any+Execution+Strategy+%E2%80%94+neither+axis+may+be+inferred+from%2C+or+used+to+infer%2C+the+other+%28see+Execution+Strategy%2C+Relationships%29%0D%0A-+A+**Deterministic**+agent-intent+is+realised+as+a+script%2C+never+as+an+LLM+call%3B+a+**Cognitive**+agent-intent+is+realised+as+an+LLM+call+with+full+content-governance+applying%0D%0A%0D%0A%23%23%23+What+it+is+not+%E2%9D%8C%0D%0A-+Not+a+meaning-transformation+scale+%28that+is+**Synthesis-regime**%29%0D%0A-+Not+a+task-shape+classification+%28that+is+**Task+Mode**%29%0D%0A-+Not+a+progression-logic+constraint+%28that+is+**Execution+Strategy**%29+%E2%80%94+see+Characteristics%0D%0A-+Not+redundant+with+Synthesis-regime+or+Task+Mode%3A+its+positions+gate+whether+those+two+axes+%28and+Source-regime%29+apply%2C+they+do+not+duplicate+a+value+on+either+axis%27s+scale%0D%0A%0D%0A%23%23%23+Synonyms+%F0%9F%8F%B7%EF%B8%8F%0D%0A-+Cognitive+gate%0D%0A%0D%0A%23%23%23+Explanation+%F0%9F%92%AC%0D%0AReasoning+mode+distinguishes+agent-intents+that+require+an+LLM+to+reason+from+work+that+is+realised+as+a+script+and+never+invokes+an+LLM+at+all+%E2%80%94+mechanical+representation-conversion+and+rule-based+condition%2Fhygiene+checks+alike.+Because+a+Deterministic+step+never+invokes+an+LLM%2C+it+never+has+content+to+govern+and+never+has+a+temperature+to+calibrate+%28see+%60foundations%2F.canonical%2Fdata-model%2Flogical-seed%2Fseed.model.md%60+%C2%A77%2C+collapsed+to+the+Cognitive+dimension+only+as+part+of+this+migration%29.%0D%0A%0D%0A**Binding+level**%3A+bound+to+**agent-intent**%2C+matching+Mode+of+operation%27s+corrected+binding+level+%28not+Agent%29+%E2%80%94+declared+per+intent%2C+alongside+Source-regime%2C+Synthesis-regime%2C+and+Task+Mode+where+those+apply.%0D%0A%0D%0A%23%23%23+Positions+%28Position+Elements%29+%F0%9F%93%8B%0D%0A%0D%0A%7C+Position+%7C+Element+classification+%7C+Description+%7C+Content-governance+model+applies%3F+%7C%0D%0A%7C---%7C---%7C---%7C---%7C%0D%0A%7C+**Cognitive**+%7C+Position+Element+%7C+Requires+an+LLM+to+reason+about+supplied+material+%7C+Yes+%E2%80%94+Source-regime%2C+Synthesis-regime%2C+and+Task+Mode+all+apply+and+MUST+be+declared+%7C%0D%0A%7C+**Deterministic**+%7C+Position+Element+%7C+Executes+by+fixed+procedure+with+zero+reasoning%3B+realised+as+a+script%2C+never+an+LLM+call+%7C+No+%E2%80%94+not+applicable%3B+a+script+has+no+Source-regime%2C+Synthesis-regime%2C+or+Task+Mode+to+declare%2C+for+the+same+reason+it+is+not+an+agent-intent+in+the+reasoning+sense+%7C%0D%0A")});
